spring.application.name=inventario

#Puerto donde "escuchará" el servidor (si el 80 está ocupado, cambiar a 8080)
server.port=80

#Formato de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Conexión local a la BD inventario en MySQL (ver bd/inventario.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario
spring.datasource.username=usuario_inventario
spring.datasource.password=Inventar1o_Clave.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Las tablas se crean con el script bd/inventario.sql
spring.jpa.hibernate.ddl-auto=none

#Mostrar el SQL en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

#Evita que aparezca ;jsessionid= en las URL
server.servlet.session.tracking-modes=cookie
